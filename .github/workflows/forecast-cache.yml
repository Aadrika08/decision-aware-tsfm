name: Forecast cache

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned cache-test dependencies
        run: python -m pip install numpy==1.26.4 pyarrow==16.1.0 pandas==2.2.3 scipy==1.11.4
      - name: Install package without forecasting dependencies
        run: python -m pip install --no-deps -e .
      - name: Download historical cache evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0-smoke --pattern forecast-smoke-sample.zip --dir cache
      - name: Test cache contracts and recovery
        run: python -m unittest tests.integration.test_cache_schema tests.integration.test_smoke_release tests.integration.test_cache_adapters tests.integration.test_cache_planner tests.integration.test_cache_executor tests.integration.test_cache_budget tests.integration.test_forecast_cache_cli tests.integration.test_pilot_adapters tests.integration.test_pilot_qualification tests.integration.test_pilot_readiness tests.integration.test_pilot_measurement -v
