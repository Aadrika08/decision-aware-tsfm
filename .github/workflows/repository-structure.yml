name: Repository structure

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the package test dependency
        run: python -m pip install --upgrade pip numpy
      - name: Install the repository package
        run: python -m pip install --no-deps -e .
      - name: Compile repository Python files
        run: python -m compileall -q src scripts tests
      - name: Verify the stable package layout
        run: python -m unittest tests.unit.test_package_layout tests.unit.test_pilot_checkpoint -v
